<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Euphy Api - Creative Dashboard</title>
    <link rel="icon" type="image/jpeg" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRXHFJP9VXUiUz_U1QVB_9ZLyYDGQ5flkJXBFTOoSaDOaIgkv5X3I8nyxo&s=10">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="anime-character"></div>

    <div class="container">
        <header>
            <span class="jp-tag">エウフィ ・ API</span>
            <h1>✨ Euphy Api</h1>
            <p>Creative & Simple API Dashboard</p>
            <div class="info-row">
                <span class="badge status"><i class="fas fa-circle"></i> Status: Online</span>
                <span class="badge key"><i class="fas fa-key"></i> Key: yusz123</span>
            </div>
        </header>

        <main id="menu-container">
            <div class="loading">Memuat fitur...</div>
        </main>

        <footer>
            <p>&copy; 2026 <b>IyuszTempest</b> | Powered by Euphylia Magenta</p>
        </footer>
    </div>

    <script>
        async function loadMenu() {
            try {
                const res = await fetch('/api/list');
                const data = await res.json();
                const container = document.getElementById('menu-container');
                container.innerHTML = '';

                for (const [category, items] of Object.entries(data)) {
                    let section = document.createElement('section');
                    section.className = 'cat-group';
                    section.innerHTML = `<h2 class="cat-title">${category}</h2><div class="api-grid"></div>`;
                    
                    const grid = section.querySelector('.api-grid');
                    items.forEach(item => {
                        const sep = item.path.includes('?') ? '&' : '?';
                        grid.innerHTML += `
                            <div class="api-card">
                                <span class="tag-label">${category}</span>
                                <h3>${item.name}</h3>
                                <p>${item.desc}</p>
                                <a href="${item.path}${sep}apikey=yusz123" target="_blank">Execute <i class="fas fa-arrow-right"></i></a>
                            </div>`;
                    });
                    container.appendChild(section);
                }
            } catch (e) {
                document.getElementById('menu-container').innerText = "Gagal memuat menu.";
            }
        }
        loadMenu();
    </script>
</body>
</html>
