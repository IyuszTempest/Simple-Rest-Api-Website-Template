<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Euphy Api - Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>✨ Euphy Api Dashboard</h1>
        <p>Halo, Yus! Dashboard ini otomatis update lho.</p>
        <div id="menu-container">Loading fiturnya sabar ya...</div>
    </div>

    <script>
        async function loadMenu() {
            try {
                const res = await fetch('/api/list');
                const data = await res.json();
                const container = document.getElementById('menu-container');
                container.innerHTML = '';

                for (const [category, items] of Object.entries(data)) {
                    let section = `<div class="category"><h2>「${category.toUpperCase()}」</h2>`;
                    items.forEach(item => {
                        section += `
                            <div class="card">
                                <h3>${item.name}</h3>
                                <p>${item.desc}</p>
                                <a href="${item.path}&apikey=yusz123" target="_blank">Cek Endpoint</a>
                            </div>`;
                    });
                    section += `</div>`;
                    container.innerHTML += section;
                }
            } catch (e) {
                document.getElementById('menu-container').innerText = "Gagal memuat menu.";
            }
        }
        loadMenu();
    </script>
</body>
</html>
