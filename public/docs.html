<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IyuszTempest - API Playground</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #ff66c4; /* Warna khas cewek wibu gaul */
            --glass: rgba(255, 255, 255, 0.1);
            --border: rgba(255, 255, 255, 0.2);
        }

        body {
            margin: 0;
            background: url('https://files.catbox.moe/pm0mmf.jpg') no-repeat center center fixed; /* Latar Elaina */
            background-size: cover;
            font-family: 'Poppins', sans-serif;
            color: white;
            min-height: 100vh;
        }

        /* Overlay transparan agar teks terbaca */
        .overlay {
            background: rgba(0, 0, 0, 0.6);
            min-height: 100vh;
            width: 100%;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--glass);
            backdrop-filter: blur(15px);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 30px;
        }

        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { color: var(--primary); text-shadow: 0 0 10px var(--primary); margin: 0; }

        .feature-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .card {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            padding: 20px;
            border: 1px solid var(--border);
            transition: 0.3s;
        }

        .card:hover { border-color: var(--primary); transform: translateY(-5px); }
        
        h3 { margin-top: 0; font-size: 1.1em; color: var(--primary); display: flex; align-items: center; gap: 10px; }

        .input-wrapper { margin-top: 15px; }
        label { display: block; font-size: 0.8em; margin-bottom: 5px; opacity: 0.8; }
        
        .flex-input { display: flex; gap: 10px; }
        input {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            padding: 12px;
            border-radius: 8px;
            color: white;
            outline: none;
        }

        button {
            background: var(--primary);
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        button:hover { box-shadow: 0 0 15px var(--primary); }

        /* Hasil Box */
        #result-container {
            margin-top: 30px;
            background: rgba(0, 0, 0, 0.8);
            border-radius: 15px;
            padding: 20px;
            display: none;
            border: 1px dashed var(--primary);
        }

        #media-preview { text-align: center; margin-bottom: 15px; }
        #media-preview img { max-width: 100%; border-radius: 10px; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        #media-preview audio { width: 100%; margin-top: 10px; }

        pre {
            background: #1e1e1e;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.8em;
            overflow-x: auto;
            color: #00ff00; /* Warna retro hacker */
        }
    </style>
</head>
<body>

<div class="overlay">
    <div class="container">
        <div class="header">
            <h1><i class="fa-solid fa-code-branch"></i> IyuszTempest API</h1>
            <p>Interactive Playground - Fitur Khusus Yus & Teman-teman</p>
        </div>

        <div class="feature-grid">
            <div class="card">
                <h3><i class="fa-solid fa-play"></i> YT Music Play</h3>
                <div class="input-wrapper">
                    <label>Input Judul Lagu:</label>
                    <div class="flex-input">
                        <input type="text" id="queryPlay" placeholder="Contoh: Kawaikute Gomen">
                        <button onclick="execute('play', 'queryPlay')">GAS!</button>
                    </div>
                </div>
            </div>

            <div class="card">
                <h3><i class="fa-solid fa-link"></i> URL Downloader</h3>
                <div class="input-wrapper">
                    <label>Input Link (TikTok/YT/AIO):</label>
                    <div class="flex-input">
                        <input type="text" id="urlInput" placeholder="Paste link di sini...">
                        <button onclick="execute('aio', 'urlInput')">UNDUH</button>
                    </div>
                </div>
            </div>

            <div class="card">
                <h3><i class="fa-solid fa-image"></i> Anime Random</h3>
                <div class="input-wrapper">
                    <label>Pilih Karakter:</label>
                    <div class="flex-input" style="flex-wrap: wrap;">
                        <button onclick="executeAnime('waifu')" style="flex:1">Waifu</button>
                        <button onclick="executeAnime('neko')" style="flex:1">Neko</button>
                        <button onclick="executeAnime('megumin')" style="flex:1">Megumin</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="result-container">
            <h4 style="margin:0 0 10px 0; color: var(--primary);">RESULT OUTPUT:</h4>
            <div id="media-preview"></div>
            <pre id="json-output"></pre>
        </div>
    </div>
</div>

<script>
    const APIKEY = 'yusz123'; // Apikey andalanmu

    async function execute(feature, inputId) {
        const val = document.getElementById(inputId).value;
        if(!val) return alert('Input tidak boleh kosong, Yus!');

        const resContainer = document.getElementById('result-container');
        const mediaBox = document.getElementById('media-preview');
        const jsonBox = document.getElementById('json-output');

        resContainer.style.display = 'block';
        mediaBox.innerHTML = '<p>Sabar ya, lagi diproses...</p>';
        jsonBox.innerText = 'Loading JSON...';

        try {
            // Kita pakai endpoint yang sesuai (query atau url)
            const param = feature === 'play' ? 'query' : 'url';
            const response = await fetch(`/api/download?feature=${feature}&${param}=${encodeURIComponent(val)}&apikey=${APIKEY}`);
            const data = await response.json();

            jsonBox.innerText = JSON.stringify(data, null, 2);
            mediaBox.innerHTML = '';

            // LOGIKA OUTPUT MEDIA
            if (data.status === "success" || data.status === true) {
                const res = data.result;
                if (feature === 'play') {
                    mediaBox.innerHTML = `
                        <img src="${res.thumbnail}" style="width:150px;"><br>
                        <strong>${res.title}</strong><br>
                        <audio controls autoplay src="${res.download_url}"></audio>
                    `;
                } else if (data.result && data.result.video) {
                    mediaBox.innerHTML = `<video controls style="width:100%"><source src="${data.result.video}" type="video/mp4"></video>`;
                }
            }
        } catch (e) {
            mediaBox.innerHTML = `<p style="color:red">Error: ${e.message}</p>`;
        }
    }

    async function executeAnime(type) {
        const resContainer = document.getElementById('result-container');
        const mediaBox = document.getElementById('media-preview');
        resContainer.style.display = 'block';
        mediaBox.innerHTML = '<p>Mencari waifu...</p>';

        try {
            const response = await fetch(`/api/anime/${type}?apikey=${APIKEY}`);
            const data = await response.json();
            document.getElementById('json-output').innerText = JSON.stringify(data, null, 2);
            mediaBox.innerHTML = `<img src="${data.result}" style="max-height:400px;">`;
        } catch (e) {
            alert('Gagal ambil anime');
        }
    }
</script>

</body>
  </html>
